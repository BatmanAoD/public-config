# Config: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

# `$vcs` must be included explicitly, since it is not included by default.
# All modules must be included to keep them in the expected order.
format="""
$username\
$hostname\
$localip\
$singularity\
$kubernetes\
$directory\
$vcsh\
$vcs\
$all\
$shlvl\
"""

[vcs]
order = ["jj", "git"]

# Make sure git entries are not separate from `$vcs`
[git_branch]
disabled = true
[git_commit]
disabled = true
[git_state]
disabled = true
[git_metrics]
disabled = true

[shell]
bash_indicator = '[\$](bold turquoise)'
powershell_indicator  = '[_ ](bold bg:purple fg:white)'
nu_indicator = '[>](bold green)'
disabled = false

[shlvl]
disabled = false
format = '[$symbol]($style)'
repeat = true
symbol = '❯'
repeat_offset = 1
threshold = 0

[hostname]
ssh_only = false

[mise]
disabled = true

# third-party `jj` support, prior to first-party support being added to `starship`

# [custom.jj]
# # https://github.com/dmmulroy/jj-starship
# when = "jj-starship detect"
# shell = ["jj-starship"]
# format = "$output "

# # https://gitlab.com/lanastara_foss/starship-jj
# command = "prompt"
# format = "$output"
# ignore_timeout = false
# shell = ["starship-jj", "--ignore-working-copy", "starship"]
# use_stdin = false
# when = true
